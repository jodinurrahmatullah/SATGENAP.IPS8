        options: ["Pembangunan mall mewah", "Program BPJS Kesehatan dan Program Keluarga Harapan (PKH)", "Pemberian izin tambang asing", "Pembangunan sirkuit balap"],
        answer: 1,
        explanation: "BPJS dan PKH adalah program jaring pengaman sosial pemerintah agar masyarakat menengah ke bawah bisa mengakses layanan kesehatan dan ekonomi."
      },
      {
        q: "Kendala yang sering dihadapi dalam perdagangan antarpulau di Indonesia adalah...",
        options: ["Infrastruktur pelayaran dan biaya logistik antar pulau yang masih mahal", "Masyarakat yang menolak barang dari pulau lain", "Tidak ada barang yang bisa diperjualbelikan", "Bahasa yang digunakan sangat berbeda sehingga tidak bisa berkomunikasi"],
        answer: 0,
        explanation: "Meskipun potensinya besar, biaya pengiriman barang (logistik) antarpulau seringkali lebih mahal dibandingkan mengirim barang ke luar negeri."
      },
      {
        q: "Ekonomi kreatif merupakan sektor yang mengandalkan... sebagai modal utamanya.",
        options: ["Sumber daya tambang", "Luas lahan pertanian", "Ide, kreativitas, dan kekayaan intelektual manusia", "Banyaknya jumlah buruh pabrik"],
        answer: 2,
        explanation: "Ekonomi kreatif (seperti game, fashion, kuliner, seni) bersumber pada ide dan kreativitas otak manusia, bukan semata pada SDA mentah."
      },
      {
        q: "Tujuan dibentuknya Badan Usaha Milik Swasta (BUMS) dalam struktur ekonomi Indonesia adalah...",
        options: ["Menguasai hajat hidup orang banyak secara monopoli", "Membantu pemerintah membuka lapangan kerja dan meningkatkan penerimaan pajak", "Mencetak uang secara mandiri", "Menggantikan peran koperasi"],
        answer: 1,
        explanation: "BUMS (seperti PT swasta) sangat vital perannya untuk menyerap tenaga kerja, menumbuhkan investasi, dan membayar pajak kepada negara."
      }
    ];

    // --- CUSTOM SVG ICONS TO PREVENT EXTRA CDN LOAD ISSUES ---
    const Icons = {
      Clock: () => (
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
      ),
      AlertTriangle: ({ className }) => (
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>
      ),
      Menu: () => (
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="4" y1="12" x2="20" y2="12"></line><line x1="4" y1="6" x2="20" y2="6"></line><line x1="4" y1="18" x2="20" y2="18"></line></svg>
      ),
      X: () => (
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
      ),
      CheckCircle: ({ className }) => (
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
      ),
      XCircle: ({ className }) => (
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"></circle><line x1="15" y1="9" x2="9" y2="15"></line><line x1="9" y1="9" x2="15" y2="15"></line></svg>
      ),
      ChevronLeft: () => (
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
      ),
      ChevronRight: () => (
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
      ),
      Send: () => (
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
      ),
      Check: () => (
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
      )
    };

    function App() {
      const [appState, setAppState] = useState('login'); // 'login', 'exam', 'result'
      const [student, setStudent] = useState({ name: '', cls: '8 A' });
      const [answers, setAnswers] = useState({});
      const [currentIndex, setCurrentIndex] = useState(0);
      const [timeLeft, setTimeLeft] = useState(90 * 60); // 90 menit
      const [warnings, setWarnings] = useState(0);
      const [violationList, setViolationList] = useState([]);
      const [showWarningModal, setShowWarningModal] = useState(false);
      const [warningMsg, setWarningMsg] = useState("");
      const [isSidebarOpen, setIsSidebarOpen] = useState(false);
      const [showSubmitConfirm, setShowSubmitConfirm] = useState(false);
      const [finalScore, setFinalScore] = useState({ score: 0, correct: 0, wrong: 0 });
      const [isSubmittingToSheet, setIsSubmittingToSheet] = useState(false);

      // URL GOOGLE APPS SCRIPT
      const GOOGLE_SHEET_API_URL = "https://script.google.com/macros/s/AKfycbwiGTMHlRxumM3Z2P-m-U1FTuBOgOTSEFOtW9rL_IHsvBCGM_Ad5wd6YHHDNCDm9c14/exec";

      // --- ANTI CHEATING LOGIC ---
      useEffect(() => {
        if (appState !== 'exam') return;

        const handleVisibilityChange = () => {
          if (document.hidden) {
            triggerWarning("Keluar tab/aplikasi");
          }
        };

        const handleBlur = () => {
          triggerWarning("Keluar fokus layar ujian (membuka pop-up/notifikasi/split screen)");
        };

        document.addEventListener("visibilitychange", handleVisibilityChange);
        window.addEventListener("blur", handleBlur);

        return () => {
          document.removeEventListener("visibilitychange", handleVisibilityChange);
          window.removeEventListener("blur", handleBlur);
        };
      }, [appState, warnings]);

      const triggerWarning = useCallback((reason) => {
        if (appState !== 'exam') return;
        
        setViolationList(prevList => {
          const timestamp = new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
          const markedReason = `${reason} (${timestamp})`;
          const updatedList = [...prevList, markedReason];

          setWarnings(prevWarnings => {
            const newWarnings = prevWarnings + 1;
            if (newWarnings >= 3) {
              setWarningMsg(`PELANGGARAN MAKSIMAL! Ujian Anda diakhiri secara otomatis.`);
              setShowWarningModal(true);
              setTimeout(() => {
                forceSubmitExam(newWarnings, updatedList);
              }, 3000);
            } else {
              setWarningMsg(`PERINGATAN ${newWarnings}/3: Terdeteksi tindakan kecurangan:\n"${reason}"\n\nJangan mengulangi tindakan ini atau ujian akan ditutup otomatis!`);
              setShowWarningModal(true);
            }
            return newWarnings;
          });

          return updatedList;
        });
      }, [appState]);

      // --- TIMER LOGIC ---
      useEffect(() => {
        if (appState !== 'exam' || timeLeft <= 0) return;

        const timer = setInterval(() => {
          setTimeLeft(prev => {
            if (prev <= 1) {
              clearInterval(timer);
              forceSubmitExam(warnings, violationList);
              return 0;
            }
            return prev - 1;
          });
        }, 1000);

        return () => clearInterval(timer);
      }, [appState, timeLeft, warnings, violationList]);

      const formatTime = (seconds) => {
        const m = Math.floor(seconds / 60).toString().padStart(2, '0');
        const s = (seconds % 60).toString().padStart(2, '0');
        return `${m}:${s}`;
      };

      // --- ACTIONS ---
      const handleStart = (e) => {
        e.preventDefault();
        if (student.name.trim().length < 3) {
          alert("Masukkan nama lengkap Anda!");
          return;
        }
        if (document.documentElement.requestFullscreen) {
          document.documentElement.requestFullscreen().catch(() => console.log("Fullscreen ditolak"));
        }
        setAppState('exam');
      };

      const handleSelectOption = (qIndex, optIndex) => {
        setAnswers(prev => ({ ...prev, [qIndex]: optIndex }));
      };

      const handleNext = () => {
        if (currentIndex < questions.length - 1) setCurrentIndex(prev => prev + 1);
      };

      const handlePrev = () => {
        if (currentIndex > 0) setCurrentIndex(prev => prev - 1);
      };

      const attemptSubmit = () => {
        setShowSubmitConfirm(true);
      };

      const forceSubmitExam = (currentWarnings, currentViolations) => {
        calculateAndFinish(currentWarnings, currentViolations);
      };

      const calculateAndFinish = async (finalWarnings, currentViolations = violationList) => {
        let correct = 0;
        let wrong = 0;
        
        questions.forEach((q, idx) => {
          if (answers[idx] === q.answer) {
            correct++;
          } else {
            wrong++;
          }
        });

        const score = correct * 2;
        setFinalScore({ score, correct, wrong });
        setAppState('result');

        if (document.fullscreenElement) {
          document.exitFullscreen().catch(err => console.log(err));
        }

        setIsSubmittingToSheet(true);
        try {
          const payload = {
            nama: student.name,
            kelas: student.cls,
            skor: score,
            benar: correct,
            salah: wrong,
            pelanggaran: finalWarnings,
            jenis_pelanggaran: currentViolations.length > 0 ? currentViolations.join("; ") : "Tidak ada pelanggaran"
          };

          fetch(GOOGLE_SHEET_API_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: {
              'Content-Type': 'application/json',
            },
            body: JSON.stringify(payload)
          }).then(() => {
            console.log("Data terkirim ke spreadsheet");
          }).catch(err => {
            console.error("Gagal mengirim ke spreadsheet", err);
          });
        } catch (e) {
          console.error(e);
        } finally {
          setIsSubmittingToSheet(false);
        }
      };

      // --- RENDERERS ---

      if (appState === 'login') {
        return (
          <div className="min-h-screen bg-gray-100 flex items-center justify-center p-4">
            <div className="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md border-t-8 border-blue-600">
              <div className="text-center mb-6">
                <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/9/9e/Tut_Wuri_Handayani_Logo.svg/200px-Tut_Wuri_Handayani_Logo.svg.png" alt="Logo" className="w-20 h-20 mx-auto mb-4" />
                <h1 className="text-2xl font-bold text-gray-800">UAS Genap IPS</h1>
                <h2 className="text-lg text-gray-600">SMPN 38 Bandar Lampung</h2>
                <p className="text-sm text-red-500 mt-2 font-medium bg-red-50 p-2 rounded">
                  Aplikasi dilengkapi sistem Anti-Kecurangan. <br/>Dilarang keluar/ganti tab selama ujian!
                </p>
              </div>

              <form onSubmit={handleStart} className="space-y-4">
                <div>
                  <label className="block text-sm font-medium text-gray-700 mb-1">Nama Lengkap</label>
                  <input 
                    type="text" 
                    required
                    className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none"
                    placeholder="Masukkan nama Anda..."
                    value={student.name}
                    onChange={(e) => setStudent({ ...student, name: e.target.value })}
                  />
                </div>
                <div>
                  <label className="block text-sm font-medium text-gray-700 mb-1">Kelas</label>
                  <select 
                    className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none"
                    value={student.cls}
                    onChange={(e) => setStudent({ ...student, cls: e.target.value })}
                  >
                    <option value="8 A">8 A</option>
                    <option value="8 B">8 B</option>
                    <option value="8 C">8 C</option>
                    <option value="8 D">8 D</option>
                  </select>
                </div>
                <button 
                  type="submit" 
                  className="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg transition duration-200 mt-4 flex justify-center items-center gap-2"
                >
                  Mulai Ujian <Icons.ChevronRight />
                </button>
              </form>
            </div>
          </div>
        );
      }

      if (appState === 'exam') {
        const q = questions[currentIndex];
        const answeredCount = Object.keys(answers).length;
        const isLastQuestion = currentIndex === questions.length - 1;

        return (
          <div className="min-h-screen bg-gray-50 flex flex-col select-none">
            {/* HEADER */}
            <header className="bg-white shadow-sm p-4 sticky top-0 z-20 flex justify-between items-center border-b border-gray-200">
              <div className="flex items-center gap-3">
                <button 
                  onClick={() => setIsSidebarOpen(true)}
                  className="p-2 bg-gray-100 rounded-lg text-gray-700 hover:bg-gray-200"
                >
                  <Icons.Menu />
                </button>
                <div className="hidden sm:block">
                  <div className="font-bold text-gray-800">{student.name}</div>
                  <div className="text-xs text-gray-500">Kelas {student.cls}</div>
                </div>
              </div>
              
              <div className="flex items-center gap-4">
                <div className={`flex items-center gap-2 px-3 py-1 rounded-full font-bold ${timeLeft < 600 ? 'bg-red-100 text-red-600' : 'bg-blue-100 text-blue-700'}`}>
                  <Icons.Clock />
                  {formatTime(timeLeft)}
                </div>
                <div className={`flex items-center gap-1 font-bold ${warnings > 0 ? 'text-red-500' : 'text-gray-400'}`}>
                  <Icons.AlertTriangle />
                  <span className="hidden sm:inline">{warnings}/3</span>
                </div>
              </div>
            </header>

            {/* SIDEBAR (Daftar Soal) */}
            {isSidebarOpen && (
              <div className="fixed inset-0 bg-black bg-opacity-50 z-40 flex justify-end">
                <div className="bg-white w-80 h-full shadow-2xl flex flex-col">
                  <div className="p-4 border-b flex justify-between items-center bg-blue-600 text-white">
                    <h3 className="font-bold">Daftar Soal ({answeredCount}/{questions.length})</h3>
                    <button onClick={() => setIsSidebarOpen(false)} className="p-1"><Icons.X /></button>
                  </div>
                  <div className="p-4 grid grid-cols-5 gap-2 overflow-y-auto flex-grow content-start">
                    {questions.map((_, idx) => {
                      const isAnswered = answers[idx] !== undefined;
                      const isActive = currentIndex === idx;
                      return (
                        <button
                          key={idx}
                          onClick={() => { setCurrentIndex(idx); setIsSidebarOpen(false); }}
                          className={`
                            w-10 h-10 rounded-lg text-sm font-bold flex items-center justify-center
                            ${isActive ? 'ring-2 ring-blue-600 ring-offset-2' : ''}
                            ${isAnswered ? 'bg-green-500 text-white' : 'bg-gray-200 text-gray-700'}
                          `}
                        >
                          {idx + 1}
                        </button>
                      );
                    })}
                  </div>
                  <div className="p-4 border-t">
                    <button 
                      onClick={attemptSubmit}
                      className="w-full bg-red-600 text-white font-bold py-3 rounded-lg flex justify-center items-center gap-2 hover:bg-red-700"
                    >
                      <Icons.Send /> Akhiri Ujian
                    </button>
                  </div>
                </div>
              </div>
            )}

            {/* MAIN QUESTION AREA */}
            <main className="flex-grow flex justify-center p-4 md:p-6 overflow-y-auto pb-24">
              <div className="bg-white w-full max-w-3xl rounded-2xl shadow-sm border border-gray-200 p-6">
                <div className="flex justify-between items-start mb-6">
                  <span className="bg-blue-100 text-blue-800 text-sm font-bold px-3 py-1 rounded-full">
                    Soal {currentIndex + 1} dari {questions.length}
                  </span>
                </div>
                
                <p className="text-lg text-gray-800 mb-8 leading-relaxed font-medium">
                  {q.q}
                </p>

                <div className="space-y-3">
                  {q.options.map((opt, optIdx) => {
                    const isSelected = answers[currentIndex] === optIdx;
                    return (
                      <div 
                        key={optIdx}
                        onClick={() => handleSelectOption(currentIndex, optIdx)}
                        className={`
                          p-4 rounded-xl border-2 cursor-pointer transition-all flex items-center gap-3
                          ${isSelected ? 'border-blue-500 bg-blue-50' : 'border-gray-200 hover:border-blue-300 hover:bg-gray-50'}
                        `}
                      >
                        <div className={`
                          w-6 h-6 rounded-full border-2 flex items-center justify-center flex-shrink-0
                          ${isSelected ? 'border-blue-600' : 'border-gray-400'}
                        `}>
                          {isSelected && <div className="w-3 h-3 bg-blue-600 rounded-full" />}
                        </div>
                        <span className={`text-base ${isSelected ? 'text-blue-900 font-medium' : 'text-gray-700'}`}>
                          {String.fromCharCode(65 + optIdx)}. {opt}
                        </span>
                      </div>
                    );
                  })}
                </div>
              </div>
            </main>

            {/* FOOTER NAVIGATION */}
            <footer className="bg-white border-t p-4 fixed bottom-0 w-full flex justify-between max-w-full">
              <div className="flex w-full max-w-3xl mx-auto gap-2">
                 <button 
                    onClick={handlePrev}
                    disabled={currentIndex === 0}
                    className={`flex-1 py-3 px-4 rounded-lg flex items-center justify-center gap-2 font-bold transition
                      ${currentIndex === 0 ? 'bg-gray-100 text-gray-400 cursor-not-allowed' : 'bg-gray-200 text-gray-800 hover:bg-gray-300'}
                    `}
                  >
                    <Icons.ChevronLeft /> Sebelumnya
                  </button>
                  
                  {isLastQuestion ? (
                     <button 
                     onClick={attemptSubmit}
                     className="flex-1 py-3 px-4 rounded-lg flex items-center justify-center gap-2 font-bold bg-green-600 text-white hover:bg-green-700 shadow-md"
                   >
                     Selesai <Icons.Check />
                   </button>
                  ) : (
                    <button 
                      onClick={handleNext}
                      className="flex-1 py-3 px-4 rounded-lg flex items-center justify-center gap-2 font-bold bg-blue-600 text-white hover:bg-blue-700 shadow-md"
                    >
                      Selanjutnya <Icons.ChevronRight />
                    </button>
                  )}
              </div>
            </footer>

            {/* MODALS */}
            {showWarningModal && (
              <div className="fixed inset-0 bg-red-900 bg-opacity-90 flex items-center justify-center z-50 p-4">
                <div className="bg-white p-6 rounded-xl shadow-2xl max-w-sm text-center transform scale-105 transition-transform">
                  <Icons.AlertTriangle className="mx-auto text-red-500 mb-4 animate-bounce text-5xl" />
                  <h2 className="text-2xl font-bold text-red-600 mb-2">PERINGATAN!</h2>
                  <p className="text-gray-800 font-medium mb-6 whitespace-pre-line">{warningMsg}</p>
                  {warnings < 3 && (
                    <button 
                      onClick={() => setShowWarningModal(false)}
                      className="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-3 rounded-lg"
                    >
                      Saya Mengerti
                    </button>
                  )}
                </div>
              </div>
            )}

            {showSubmitConfirm && (
              <div className="fixed inset-0 bg-black bg-opacity-60 flex items-center justify-center z-50 p-4">
                <div className="bg-white p-6 rounded-xl shadow-2xl max-w-sm text-center">
                  <h2 className="text-xl font-bold text-gray-800 mb-2">Konfirmasi Pengumpulan</h2>
                  <p className="text-gray-600 mb-6">
                    Anda telah menjawab <b>{answeredCount}</b> dari <b>{questions.length}</b> soal.
                    {questions.length - answeredCount > 0 && (
                      <span className="block mt-2 text-red-600 font-bold bg-red-50 p-2 rounded">
                        Masih ada {questions.length - answeredCount} soal yang belum dijawab!
                      </span>
                    )}
                  </p>
                  <div className="flex gap-3">
                    <button 
                      onClick={() => setShowSubmitConfirm(false)}
                      className="flex-1 bg-gray-200 text-gray-800 font-bold py-2 rounded-lg"
                    >
                      Batal
                    </button>
                    <button 
                      onClick={() => { setShowSubmitConfirm(false); calculateAndFinish(warnings, violationList); }}
                      className="flex-1 bg-blue-600 text-white font-bold py-2 rounded-lg hover:bg-blue-700"
                    >
                      Ya, Kumpulkan
                    </button>
                  </div>
                </div>
              </div>
            )}
          </div>
        );
      }

      if (appState === 'result') {
        return (
          <div className="min-h-screen bg-gray-100 p-4 pb-10">
            <div className="max-w-3xl mx-auto">
              {/* SKOR CARD */}
              <div className="bg-white rounded-2xl shadow-lg p-6 mb-6 text-center border-t-8 border-green-500 mt-4">
                <h1 className="text-2xl font-bold text-gray-800 mb-2">Ujian Selesai!</h1>
                <p className="text-gray-600 mb-6">Terima kasih, <b>{student.name}</b> (Kelas {student.cls})</p>
                
                <div className="flex justify-center gap-4 mb-6">
                  <div className="bg-blue-50 p-4 rounded-xl min-w-[100px]">
                    <div className="text-sm text-blue-600 font-bold">NILAI</div>
                    <div className="text-4xl font-black text-blue-700">{finalScore.score}</div>
                  </div>
                  <div className="bg-green-50 p-4 rounded-xl min-w-[100px]">
                    <div className="text-sm text-green-600 font-bold">BENAR</div>
                    <div className="text-3xl font-bold text-green-700">{finalScore.correct}</div>
                  </div>
                  <div className="bg-red-50 p-4 rounded-xl min-w-[100px]">
                    <div className="text-sm text-red-600 font-bold">SALAH</div>
                    <div className="text-3xl font-bold text-red-700">{finalScore.wrong}</div>
                  </div>
                </div>
                
                {warnings > 0 && (
                   <div className="bg-yellow-50 border border-yellow-200 text-yellow-800 text-sm p-4 rounded-lg mb-4 text-left">
                     <div className="font-bold flex items-center gap-2 mb-2">
                       <Icons.AlertTriangle className="text-yellow-600" /> Riwayat Pelanggaran ({warnings} kali):
                     </div>
                     <ul className="list-disc list-inside text-xs space-y-1">
                       {violationList.map((item, idx) => (
                         <li key={idx} className="font-medium text-red-700">{item}</li>
                       ))}
                     </ul>
                   </div>
                )}
                
                {isSubmittingToSheet && <p className="text-sm text-gray-500 animate-pulse">Menyimpan data ke server...</p>}
              </div>

              <h2 className="text-xl font-bold text-gray-800 mb-4 px-2">Review Jawaban & Pembahasan</h2>
              
              {/* REVIEW JAWABAN */}
              <div className="space-y-4">
                {questions.map((q, idx) => {
                  const userAnswerIdx = answers[idx];
                  const isCorrect = userAnswerIdx === q.answer;
                  const isUnanswered = userAnswerIdx === undefined;

                  return (
                    <div key={idx} className={`bg-white rounded-xl shadow-sm p-5 border-l-4 ${isCorrect ? 'border-green-500' : 'border-red-500'}`}>
                      <div className="flex gap-3 items-start mb-3">
                        <div className="mt-1">
                          {isCorrect ? <Icons.CheckCircle className="text-green-500" /> : <Icons.XCircle className="text-red-500" />}
                        </div>
                        <div>
                          <h3 className="font-bold text-gray-800">Soal {idx + 1}</h3>
                          <p className="text-gray-700 mt-1">{q.q}</p>
                        </div>
                      </div>

                      <div className="ml-9 space-y-2 text-sm">
                        {/* Jawaban Siswa */}
                        <div className="bg-gray-50 p-3 rounded-lg border border-gray-200">
                          <span className="text-gray-500 font-medium">Jawaban Anda: </span>
                          {isUnanswered ? (
                            <span className="text-red-500 font-bold italic">Tidak Dijawab</span>
                          ) : (
                            <span className={isCorrect ? "text-green-700 font-bold" : "text-red-600 font-bold"}>
                              {String.fromCharCode(65 + userAnswerIdx)}. {q.options[userAnswerIdx]}
                            </span>
                          )}
                        </div>

                        {/* Jika Salah, tampilkan jawaban benar */}
                        {!isCorrect && (
                          <div className="bg-green-50 p-3 rounded-lg border border-green-200">
                            <span className="text-green-800 font-medium">Jawaban Benar: </span>
                            <span className="text-green-700 font-bold">
                               {String.fromCharCode(65 + q.answer)}. {q.options[q.answer]}
                            </span>
                          </div>
                        )}

                        {/* Penjelasan/Alasan */}
                        <div className="bg-blue-50 p-3 rounded-lg border border-blue-200 mt-2">
                           <span className="text-blue-800 font-bold text-xs uppercase tracking-wider block mb-1">Pembahasan:</span>
                           <span className="text-blue-900 leading-relaxed">
                             {q.explanation}
                           </span>
                        </div>
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
          </div>
        );
      }
    }

    const container = document.getElementById('root');
    const root = ReactDOM.createRoot(container);
    root.render(<App />);
  </script>
</body>
</html>
